name: Lyrics
options:
  bundleIdPrefix: com.jayant
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Lyrics/Secrets.xcconfig
  Release: Lyrics/Secrets.xcconfig

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: AZC67HWW3C
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Lyrics:
    type: application
    platform: iOS
    sources:
      - path: Lyrics
        excludes:
          - "Secrets.xcconfig"
          - "Secrets.xcconfig.example"
      - Shared
    info:
      path: Lyrics/Info.plist
      properties:
        CFBundleDisplayName: Lyrics
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        GitHubToken: $(GITHUB_TOKEN)
        NowPlayingGistID: $(NOW_PLAYING_GIST_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jayant.lyrics
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: LyricsWidget
        embed: true

  LyricsWidget:
    type: app-extension
    platform: iOS
    sources:
      - LyricsWidget
      - Shared
    info:
      path: LyricsWidget/Info.plist
      properties:
        CFBundleDisplayName: Lyrics Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jayant.lyrics.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true
